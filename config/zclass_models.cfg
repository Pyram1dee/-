; Назначение моделей игрока классам зомби (применяется scripts/server.sh deploy).
; Формат: <имя секции в zp_zombieclasses.ini> = <модель>[, <модель2>...]
; Модель = папка/файл models/player/<модель>/<модель>.mdl.
; Строка применяется ТОЛЬКО если файл модели есть на сервере: ZP 4.3 кэширует модель класса
; без проверки существования, и отсутствующий файл роняет сервер при загрузке карты.
; Секция должна уже существовать (ZP дописывает секции новых классов при первом запуске карты).

Classic Zombie = zombie_classic
