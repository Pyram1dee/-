cso_undertaker_deploy_freeze "0.8"
cso_undertaker_slow_radius "250.0"
cso_undertaker_slow_multiplier "0.1"         // 0.1 = замедление на 90 %
cso_undertaker_affect_survivor "0"
cso_undertaker_zombie_hit_damage "600"       // 0 — зомби не повреждают деву
cso_undertaker_explode_radius "250.0"
cso_undertaker_explode_knockback "700.0"
cso_undertaker_explode_damage "0"
cso_undertaker_explode_on_expire "1"

